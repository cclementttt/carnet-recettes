name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
          EXPO_PUBLIC_PEXELS_API_KEY: ${{ secrets.EXPO_PUBLIC_PEXELS_API_KEY }}
      - name: Add PWA meta tags
        run: |
          sed -i 's|</head>|<link rel="apple-touch-icon" sizes="180x180" href="/carnet-recettes/apple-touch-icon.png" /><link rel="apple-touch-icon-precomposed" sizes="180x180" href="/carnet-recettes/apple-touch-icon.png" /><link rel="manifest" href="/carnet-recettes/manifest.json" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-status-bar-style" content="default" /><meta name="apple-mobile-web-app-title" content="Recettes" /></head>|' dist/index.html
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
